name: Bug report
description: Something in the engine, the skill, or the installer is behaving wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The two fields that decide how fast this gets fixed are
        **which build you have** and **whether you got a real WebGL2 scene or the
        static fallback** — the engine degrades silently between the two, so the same
        description can mean two unrelated bugs.

  - type: input
    id: version
    attributes:
      label: Version, or commit
      description: >-
        `npm ls scroll-flyover` for the library, or `git rev-parse --short HEAD` if you
        cloned the repo. Version numbers have been misleading here before (see
        CHANGELOG.md on 1.1.0), so a commit hash is always welcome.
      placeholder: "scroll-flyover@1.4.1"
    validations:
      required: true

  - type: dropdown
    id: render-path
    attributes:
      label: Which render path are you on?
      description: >-
        Run this in the console on the affected page — `document.querySelectorAll('canvas').length`
        (0 means the static fallback) and `!!document.querySelector('[data-sf-fallback]')`.
      options:
        - Live WebGL2 scene (a <canvas> is present)
        - Static fallback (no canvas, or [data-sf-fallback] is in the DOM)
        - prefers-reduced-motion is on
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npm install scroll-flyover (library)
        - npx scroll-flyover (Claude Code skill)
        - Cloned the repo
        - A build generated by the skill, with the engine vendored in
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Browser, OS, and viewport
      description: >-
        `window.innerWidth + 'x' + window.innerHeight` is enough for the viewport.
        Include portrait/landscape on mobile — several fixed bugs only ever appeared
        below 400 CSS px or after a rotation.
      placeholder: |
        Chrome 141 on Android 15, Pixel 8
        390x844, portrait
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: What did you expect, and what happened instead?
      description: >-
        For visual bugs a screenshot helps most. Capture the **viewport**, not the full
        page — full-page capture of a sticky canvas produces a large black gap that is
        a screenshot artifact rather than the bug. If it is a scroll bug, say roughly
        where in the flight it happens.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >-
        Paste any errors verbatim. `THREE.WebGLRenderer: Context Lost` and a message
        beginning `scroll-flyover:` are very different problems.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Your config, if relevant
      description: The object you passed to `mountScrollFlyover`, trimmed to the parts that matter.
      render: js

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: >-
            I checked that my scene builders use the `rng` from their options argument
            rather than `Math.random()` (the usual cause of "it looks different on every reload").
        - label: >-
            My container is a normal-flow element, not `position: sticky` (the usual
            cause of "the scroll pin does nothing").
