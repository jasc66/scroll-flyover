<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>renderAt fixture</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; }
    #world { width: 100%; }
  </style>
  <!--
    Fixture for scripts/render-check.mjs. Unlike the shipped template it loads three
    from the repo's own devDependency, so the check needs no network, and it exposes
    the handle on window — something a real build has no reason to do.
  -->
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <main><div id="world"></div></main>
  <script type="module">
    import * as THREE from 'three';
    import { mountScrollFlyover } from '/references/scrub-engine.js';

    function buildIsland(material) {
      return new THREE.Mesh(new THREE.CylinderGeometry(6, 6.5, 1.2, 7, 1), material);
    }

    // A scene with a time-driven material animation, so the check can tell whether
    // the time it passes actually reaches the tickers.
    function buildSpinner(materials) {
      const g = new THREE.Group();
      g.add(buildIsland(materials[0]));
      const spinner = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), materials[1]);
      spinner.position.y = 3;
      spinner.userData.tick = (elapsed) => { spinner.rotation.y = elapsed * 1.3; };
      g.add(spinner);
      return g;
    }
    function buildPlain(materials) {
      const g = new THREE.Group();
      g.add(buildIsland(materials[2]));
      return g;
    }

    window.__sfHandle = mountScrollFlyover(document.getElementById('world'), {
      palette: { colors: ['#2b6777', '#52ab98', '#c8d8e4', '#f2f2f2'], accent: '#e8a33d' },
      seed: 3,
      // Pinned, so the scroll-driven frame and renderAt's default time agree and the
      // two can be compared byte for byte.
      clock: () => 0,
      scenes: [
        { title: 'One', body: 'First scene.', build: buildSpinner },
        { title: 'Two', body: 'Second scene.', build: buildPlain },
        { title: 'Three', body: 'Third scene.', build: buildSpinner },
      ],
    });
    window.__sfReady = true;
  </script>
</body>
</html>
