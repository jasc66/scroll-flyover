<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexo Ops — scroll-flyover example (SaaS / vertical descent)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0d14; }
    #world { width: 100%; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="world"></div>

  <script type="module">
    import * as THREE from 'three';
    import { mountScrollFlyover } from '../../references/scrub-engine.js';
    import { buildIslandBase, buildBlock, buildTower, addRimGlow, layoutDescent } from '../_shared/recipes.js';

    // Subject: Nexo Ops, a project-management SaaS. Deliberate uniqueness: instead
    // of the expected "growth" narrative (spiral ascent — already used by the
    // skill's own real production build, see README), this is deliberately the
    // "surface to core" departure from the archetype table (camera-archetypes.md):
    // vertical descent through the product's own stack, dashboard down to the
    // servers that run it. Signature motif: a glowing data-ribbon (a bent tube,
    // not a flat ring) threading through every layer, built once per scene from a
    // small 3-point curve so no two layers' ribbons are identical.
    const ACCENT = '#37c6ff';

    function buildDataRibbon(materials, rng, radius = 4) {
      const pts = [];
      for (let i = 0; i < 4; i++) {
        const a = (i / 3) * Math.PI * 1.4 - 0.7;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, (rng() - 0.5) * 1.2, Math.sin(a) * radius));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const geo = new THREE.TubeGeometry(curve, 32, 0.06, 6, false);
      const mat = new THREE.MeshStandardMaterial({
        color: materials[3].color, emissive: new THREE.Color(ACCENT), emissiveIntensity: 1.4, roughness: 0.3,
      });
      return new THREE.Mesh(geo, mat);
    }

    function buildDashboardLayer(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(5.5, 0.4, materials[0], rng, { irregular: false }));
      for (let i = 0; i < 4; i++) {
        const panel = buildBlock(1.6, 1.1, 0.1, materials[1]);
        panel.position.set((i - 1.5) * 2, 0.9, 0);
        g.add(panel);
      }
      g.add(buildDataRibbon(materials, rng));
      return g;
    }

    function buildWorkflowLayer(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(5.5, 0.4, materials[0], rng, { irregular: false }));
      for (let i = 0; i < 6; i++) {
        const node = buildBlock(0.6, 0.6, 0.6, materials[2]);
        const a = (i / 6) * Math.PI * 2;
        node.position.set(Math.cos(a) * 3.4, 0.5, Math.sin(a) * 3.4);
        g.add(node);
      }
      g.add(buildDataRibbon(materials, rng));
      return g;
    }

    function buildApiLayer(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(5.5, 0.4, materials[0], rng, { irregular: false }));
      const tower = buildTower(1.4, 5, materials[1]);
      tower.position.y = 0.4;
      g.add(tower);
      for (let i = 0; i < 3; i++) {
        const stub = buildBlock(0.8, 0.3, 0.8, materials[2]);
        stub.position.set((rng() - 0.5) * 6, 0.35, (rng() - 0.5) * 6);
        g.add(stub);
      }
      g.add(buildDataRibbon(materials, rng));
      return g;
    }

    function buildDatabaseLayer(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(5.5, 0.4, materials[0], rng, { irregular: false }));
      for (let i = 0; i < 3; i++) {
        const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.6, 12), materials[1]);
        cylinder.position.set((i - 1) * 2.4, 1, 0);
        g.add(cylinder);
      }
      g.add(buildDataRibbon(materials, rng));
      return g;
    }

    // Peak scene: the infrastructure floor — this build's one true Fresnel rim-glow
    // prop (materials.md §4 budget: one prop only).
    function buildInfraLayer(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(5.5, 0.4, materials[0], rng, { irregular: false }));
      for (let i = 0; i < 8; i++) {
        const rack = buildBlock(0.5, 1.4, 0.5, materials[2]);
        const gx = (i % 4) - 1.5, gz = Math.floor(i / 4) - 0.5;
        rack.position.set(gx * 1.3, 0.7, gz * 1.3);
        g.add(rack);
      }
      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.9, 0), materials[1]);
      core.position.set(0, 2.4, 0);
      g.add(core);
      addRimGlow(core, ACCENT);
      return g;
    }

    mountScrollFlyover(document.getElementById('world'), {
      palette: { colors: ['#141a24', '#2a3446', '#3d4a63', ACCENT], accent: ACCENT },
      shapeLanguage: 'geometric',
      cameraFeel: 'glide', // required for vertical descent — banking reads as tumbling
      performance: 'rich',
      seed: 20260907,
      layout: layoutDescent(22, 6),
      scenes: [
        { build: buildDashboardLayer, eyebrow: 'Nexo Ops', title: 'Todo el equipo, una vista.', body: 'Tableros que se actualizan solos — nadie reporta estado a mano.', tags: ['Dashboard'] },
        { build: buildWorkflowLayer, eyebrow: 'Automatización', title: 'Las reglas trabajan solas.', body: 'Cada cambio de estado dispara la siguiente acción, sin scripts sueltos.', tags: ['Workflows'] },
        { build: buildApiLayer, eyebrow: 'Integraciones', title: 'Habla con lo que ya usas.', body: 'API abierta — conecta Slack, GitHub, tu CRM, sin esperar a soporte.', tags: ['API'] },
        { build: buildDatabaseLayer, eyebrow: 'Datos', title: 'Nada se pierde entre pestañas.', body: 'Una sola fuente de verdad, versionada, auditable.', tags: ['Base de datos'] },
        { build: buildInfraLayer, eyebrow: 'Infraestructura', title: 'La base que no ves — y no falla.', body: 'Escalado automático, respaldos cada hora, 99.95% uptime.', tags: ['Infraestructura'], cta: 'Empezar gratis' },
      ],
    });
  </script>
</body>
</html>
