<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alta Finca — scroll-flyover example (nature / island hop)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0e1410; }
    #world { width: 100%; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="world"></div>

  <script type="module">
    import * as THREE from 'three';
    import { mountScrollFlyover } from '../../references/scrub-engine.js';
    import {
      buildIslandBase, buildRock, buildTree, scatterInstances,
      buildWaterPlane, addRimGlow, layoutIslandHop,
    } from '../_shared/recipes.js';

    // Subject: Alta Finca, a high-altitude specialty coffee farm. Signature motif
    // (SKILL.md "Deliberate uniqueness"): the one real detail past "a coffee farm" —
    // cherries are hand-picked at 1,800m and washed in stone channels, not machine
    // processed. Every scene carries one oversized ripe-cherry cluster (icosahedra in
    // the accent red) as the recurring motif tying the whole journey together.
    const ACCENT = '#c0392b'; // ripe cherry red

    function buildCherryCluster(materials, rng, scale = 1) {
      const g = new THREE.Group();
      const positions = [[0, 0, 0], [0.5, 0.15, 0.2], [-0.4, 0.1, -0.3], [0.1, -0.2, 0.4]];
      positions.forEach(([x, y, z]) => {
        const cherry = buildRock(0.35 * scale * (0.85 + rng() * 0.3), materials[4]);
        cherry.position.set(x * scale, y * scale, z * scale);
        g.add(cherry);
      });
      return g;
    }

    // Scene 1 — nursery seedlings on the lower slope.
    function buildNursery(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(6, 1.2, materials[0], rng));
      for (let i = 0; i < 9; i++) {
        const seedling = buildTree(0.9 + rng() * 0.4, materials[3], materials[1]);
        seedling.position.set((rng() - 0.5) * 8, 0.6, (rng() - 0.5) * 8);
        g.add(seedling);
      }
      const cherries = buildCherryCluster(materials, rng, 0.6);
      cherries.position.set(2, 1.4, -2);
      g.add(cherries);
      return g;
    }

    // Scene 2 — shade-grown slope, denser canopy.
    function buildShadeSlope(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(6.5, 1.4, materials[0], rng));
      const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 2.4, 6);
      g.add(scatterInstances(trunkGeo, materials[3], 14, 5, rng));
      for (let i = 0; i < 6; i++) {
        const tree = buildTree(2.2 + rng() * 0.8, materials[3], materials[1]);
        tree.position.set((rng() - 0.5) * 9, 0.6, (rng() - 0.5) * 9);
        g.add(tree);
      }
      const cherries = buildCherryCluster(materials, rng, 0.8);
      cherries.position.set(-2.5, 2.2, 1.5);
      g.add(cherries);
      return g;
    }

    // Scene 3 — hand-picking terrace (the peak scene, SKILL.md Step 1.5).
    function buildPickingTerrace(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(7, 1.2, materials[0], rng));
      for (let i = 0; i < 5; i++) {
        const tree = buildTree(1.8 + rng() * 0.6, materials[3], materials[1]);
        tree.position.set((rng() - 0.5) * 10, 0.6, (rng() - 0.5) * 10);
        g.add(tree);
      }
      // The peak-scene focal object: an oversized cherry cluster with the build's
      // one Fresnel rim-glow prop (materials.md §4 — one prop only, per budget).
      const cherries = buildCherryCluster(materials, rng, 1.6);
      cherries.position.set(0, 2.6, 0);
      g.add(cherries);
      cherries.children.forEach((c) => addRimGlow(c, ACCENT));
      return g;
    }

    // Scene 4 — stone washing channels.
    function buildWashChannels(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(6.5, 1.2, materials[0], rng));
      const channel = buildWaterPlane(3.2, materials[2].color);
      channel.position.set(0, 0.62, 0);
      g.add(channel);
      for (let i = 0; i < 4; i++) {
        const rock = buildRock(0.4 + rng() * 0.3, materials[1]);
        const a = (i / 4) * Math.PI * 2;
        rock.position.set(Math.cos(a) * 3.4, 0.7, Math.sin(a) * 3.4);
        g.add(rock);
      }
      const cherries = buildCherryCluster(materials, rng, 0.7);
      cherries.position.set(1.5, 1.6, -1.5);
      g.add(cherries);
      return g;
    }

    // Scene 5 — the cup (last scene, hero + CTA per SKILL.md Step 1.5).
    function buildTheCup(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildIslandBase(6, 1.2, materials[0], rng));
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.9, 1.3, 16), materials[3]);
      cup.position.set(0, 1.85, 0);
      g.add(cup);
      const brew = buildWaterPlane(0.95, materials[4].color);
      brew.position.set(0, 2.5, 0);
      g.add(brew);
      const steam = buildCherryCluster(materials, rng, 0.5);
      steam.position.set(1.8, 1.6, 1.4);
      g.add(steam);
      return g;
    }

    mountScrollFlyover(document.getElementById('world'), {
      palette: { colors: ['#3f5e3a', '#6b8f5a', '#a3c586', '#5a3d2b', ACCENT], accent: ACCENT },
      shapeLanguage: 'lowpoly',
      cameraFeel: 'swoop',
      performance: 'rich',
      seed: 71100,
      layout: layoutIslandHop(24, 4),
      scenes: [
        { build: buildNursery, eyebrow: 'Alta Finca', title: 'Nace a 1.800 metros.', body: 'Cada almácigo se selecciona a mano antes de subir a la ladera de sombra.', tags: ['Origen', '1.800m'] },
        { build: buildShadeSlope, eyebrow: 'Ladera', title: 'Sombra que madura despacio.', body: 'El dosel de árboles nativos retarda la maduración y concentra el dulzor del grano.', tags: ['Cultivo de sombra'] },
        { build: buildPickingTerrace, eyebrow: 'Cosecha', title: 'Solo la cereza madura.', body: 'Recolección manual, pasada por pasada — nunca de una sola vez.', tags: ['Hecho a mano'], cta: 'Ver el proceso' },
        { build: buildWashChannels, eyebrow: 'Beneficiado', title: 'Lavado en canales de piedra.', body: 'El agua de nacimiento separa la pulpa sin perder el perfil del grano.', tags: ['Proceso húmedo'] },
        { build: buildTheCup, eyebrow: 'La taza', title: 'De la ladera a tu mesa.', body: 'Tostado en lotes pequeños, cerca de la finca, cerca de la cosecha.', tags: ['Tueste artesanal'], cta: 'Pedir ahora' },
      ],
    });
  </script>
</body>
</html>
