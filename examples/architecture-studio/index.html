<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marco Estudio — scroll-flyover example (architecture / corridor)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #10141a; }
    #world { width: 100%; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="world"></div>

  <script type="module">
    import * as THREE from 'three';
    import { mountScrollFlyover } from '../../references/scrub-engine.js';
    import {
      buildBlock, buildTower, addGridOverlay, layoutCorridor,
    } from '../_shared/recipes.js';

    // Subject: Marco Estudio, a passive-house design studio. Deliberate uniqueness
    // (SKILL.md): the one real detail past "an architecture firm" is that every
    // structural joint is left EXPOSED on purpose — "honest materials" as design
    // philosophy, not an afterthought. The signature motif is a visible two-tone
    // seam ring in every chamber, where the accent color meets the base color at
    // the exact point a real joint would sit.
    const SPACING = 26, CURVE = 8;

    // A corridor "chamber": a two-tone ring built from two half-torus arcs whose
    // seam is the signature motif, per camera-archetypes.md §4 ("each scene
    // contributes a tube segment around its anchor; props mount to the inner wall").
    function buildChamberRing(radius, tube, baseMat, accentMat) {
      const g = new THREE.Group();
      const top = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 10, 24, Math.PI), baseMat);
      const bottom = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 10, 24, Math.PI), accentMat);
      bottom.rotation.z = Math.PI;
      g.add(top, bottom);
      return g;
    }

    function buildConceptChamber(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildChamberRing(6, 0.35, materials[0], materials[3]));
      g.add(addGridOverlay(5.2, materials[3].color));
      for (let i = 0; i < 3; i++) {
        const plane = buildBlock(2.4, 0.05, 3.2, materials[1]);
        plane.position.set((rng() - 0.5) * 6, 1 + i * 0.6, (rng() - 0.5) * 2);
        plane.rotation.y = rng() * 0.6;
        g.add(plane);
      }
      return g;
    }

    function buildFrameChamber(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildChamberRing(6, 0.35, materials[0], materials[3]));
      for (let i = 0; i < 5; i++) {
        const beam = buildBlock(0.3, 4.2, 0.3, materials[2]);
        const a = (i / 5) * Math.PI * 2;
        beam.position.set(Math.cos(a) * 4, 0, Math.sin(a) * 4);
        g.add(beam);
      }
      const tower = buildTower(1.6, 3, materials[1]);
      tower.position.set(0, -1.4, 0);
      g.add(tower);
      return g;
    }

    function buildInsulationChamber(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildChamberRing(6, 0.35, materials[0], materials[3]));
      for (let i = 0; i < 10; i++) {
        const panel = buildBlock(1.1, 1.1, 0.15, materials[2]);
        const a = rng() * Math.PI * 2;
        const r = 4.6 + rng() * 0.6;
        panel.position.set(Math.cos(a) * r, (rng() - 0.5) * 3, Math.sin(a) * r);
        panel.lookAt(0, panel.position.y, 0);
        g.add(panel);
      }
      return g;
    }

    // Peak scene (SKILL.md Step 1.5): the glass facade, most visually detailed.
    function buildFacadeChamber(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildChamberRing(6, 0.4, materials[0], materials[3]));
      const glassMat = new THREE.MeshStandardMaterial({
        color: materials[1].color, transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.4,
      });
      for (let i = 0; i < 6; i++) {
        const pane = buildBlock(1.8, 2.6, 0.08, glassMat);
        const a = (i / 6) * Math.PI * 2;
        pane.position.set(Math.cos(a) * 5, 0, Math.sin(a) * 5);
        pane.lookAt(0, 0, 0);
        g.add(pane);
      }
      const mullion = buildTower(1.2, 4, materials[3]);
      mullion.position.set(0, -2, 0);
      g.add(mullion);
      return g;
    }

    function buildInteriorChamber(materials, textures, { rng }) {
      const g = new THREE.Group();
      g.add(buildChamberRing(6, 0.35, materials[0], materials[3]));
      const floor = buildBlock(9, 0.2, 9, materials[1]);
      floor.position.y = -2;
      g.add(floor);
      for (let i = 0; i < 4; i++) {
        const furniture = buildBlock(0.9 + rng() * 0.5, 0.7, 0.9, materials[2]);
        furniture.position.set((rng() - 0.5) * 5, -1.6, (rng() - 0.5) * 5);
        g.add(furniture);
      }
      return g;
    }

    mountScrollFlyover(document.getElementById('world'), {
      palette: { colors: ['#2c3440', '#8fa3b3', '#5c6b78', '#e0862f'], accent: '#e0862f' },
      shapeLanguage: 'geometric',
      cameraFeel: 'glide', // required for corridor — banking reads as tumbling here
      performance: 'rich',
      seed: 41900,
      layout: layoutCorridor(SPACING, CURVE),
      scenes: [
        { build: buildConceptChamber, eyebrow: 'Marco Estudio', title: 'La idea, antes del CAD.', body: 'Cada proyecto arranca en bocetos volumétricos, no en un software.', tags: ['Concepto'] },
        { build: buildFrameChamber, eyebrow: 'Estructura', title: 'La unión queda a la vista.', body: 'Nunca escondemos una junta — es la firma del estudio.', tags: ['Materiales honestos'] },
        { build: buildInsulationChamber, eyebrow: 'Envolvente', title: 'Casa pasiva, de fábrica.', body: 'Paneles aislantes calculados antes del primer plano estructural.', tags: ['Passive house'] },
        { build: buildFacadeChamber, eyebrow: 'Fachada', title: 'Luz que no se negocia.', body: 'Vidrio de piso a techo orientado al recorrido solar del sitio.', tags: ['Diseño bioclimático'], cta: 'Ver la fachada' },
        { build: buildInteriorChamber, eyebrow: 'Entrega', title: 'Se habita como se dibujó.', body: 'Del boceto a la llave en mano, sin perder una sola decisión.', tags: ['Proyecto terminado'], cta: 'Agendar visita' },
      ],
    });
  </script>
</body>
</html>
